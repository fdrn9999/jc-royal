name: Deploy

# Manual, gated deployment. Requires repository secrets CLOUDFLARE_API_TOKEN and
# CLOUDFLARE_ACCOUNT_ID, and real D1 database ids in the wrangler.jsonc files.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [production]
        default: production

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck && pnpm test
      - run: pnpm --filter @jc/web build && pnpm --filter @jc/admin build
      - name: Apply D1 migrations
        run: pnpm exec wrangler d1 migrations apply jc-royal-db-prod --remote --env production -c apps/api/wrangler.jsonc
      # Order matters: the Durable Object class must exist before the API binds to it,
      # and the API must exist before the admin host's service binding.
      - name: Deploy game worker (Durable Objects)
        run: pnpm exec wrangler deploy --env production -c apps/game-worker/wrangler.jsonc
      - name: Deploy API + player site
        run: pnpm exec wrangler deploy --env production -c apps/api/wrangler.jsonc
      - name: Deploy admin console
        run: pnpm exec wrangler deploy --env production -c apps/admin/wrangler.jsonc
