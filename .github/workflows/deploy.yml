name: Deploy

# Production deployment to Cloudflare.
# - Automatic: ci.yml calls this after every green push to main.
# - Manual: Actions → Deploy → Run workflow (re-runs typecheck and unit tests first).
# Requires repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
# Worker secrets (INTERNAL_SECRET, RESEND_API_KEY, ...) live in Cloudflare and survive deploys.
on:
  workflow_call:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://jc-royal.site
    # One deploy at a time; a newer push waits instead of cancelling a half-finished deploy.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PLAY_URL: https://jc-royal.site
      ADMIN_URL: https://admin.jc-royal.site
      # The same workers on the account's workers.dev subdomain (docs/DEPLOYMENT.md), outside the zone's security.
      PLAY_DEV_URL: https://play.jcroyal.workers.dev
      ADMIN_DEV_URL: https://admin.jcroyal.workers.dev
    steps:
      - name: Check Cloudflare credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Set repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (docs/DEPLOYMENT.md)."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # CI already ran the full suite before calling this workflow; manual runs get a quick check.
      - name: Typecheck and unit tests (manual runs)
        if: github.event_name == 'workflow_dispatch'
        run: pnpm typecheck && pnpm test
      - run: pnpm build
      - name: Apply D1 migrations
        run: pnpm exec wrangler d1 migrations apply jc-royal-db-prod --remote --env production -c apps/api/wrangler.jsonc
      # Order matters: the Durable Object class must exist before the API binds to it,
      # and the API must exist before the admin host's service binding.
      - name: Deploy game worker (Durable Objects)
        run: pnpm exec wrangler deploy --env production -c apps/game-worker/wrangler.jsonc
      - name: Deploy API + player site
        run: pnpm exec wrangler deploy --env production -c apps/api/wrangler.jsonc
      - name: Deploy admin console
        run: pnpm exec wrangler deploy --env production -c apps/admin/wrangler.jsonc
      # The new workers must answer 200 on workers.dev (the health JSON ok, both sites' pages). The custom domains must
      # answer too, but the zone's security has answered GitHub's runners 403 (main runs 39092482636, 39128959502, while
      # the site answered elsewhere): a 403 Cloudflare marks as its challenge is a warning, any other answer but 200 a
      # failure, with its headers shown.
      - name: Smoke check
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS "$PLAY_DEV_URL/api/health" | grep -q '"ok":true'; then break; fi
            [ "$i" = 6 ] && { echo "::error::$PLAY_DEV_URL/api/health did not return ok"; exit 1; }
            sleep 5
          done
          for url in "$PLAY_DEV_URL/" "$ADMIN_DEV_URL/"; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' "$url")
            echo "$url $code"
            [ "$code" = 200 ] || { echo "::error::$url answered $code"; exit 1; }
          done
          for url in "$PLAY_URL/api/health" "$PLAY_URL/" "$ADMIN_URL/"; do
            head=$(curl -sS -o /dev/null -D - "$url" | tr -d '\r')
            code=$(printf '%s\n' "$head" | awk 'NR == 1 { print $2 }')
            echo "$url $code"
            [ "$code" = 200 ] && continue
            if [ "$code" = 403 ] && printf '%s\n' "$head" | grep -qi '^cf-mitigated: *challenge'; then
              echo "::warning::$url answered this runner with a Cloudflare challenge; the workers answered on workers.dev"
              continue
            fi
            printf '%s\n' "$head" | grep -iE '^(HTTP|server|cf-ray|cf-mitigated|content-type|location)'
            echo "::error::$url answered $code"
            exit 1
          done
